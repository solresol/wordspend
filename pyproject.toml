[project]
name = "wordspend"
version = "0.1.0"
description = "Translation residual analysis for relative lexical compression"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
